<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="440" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Section Header -->
  <text x="550" y="48" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Step-by-Step System Lifecycle &amp; Reconciliation Workflow</text>
  <text x="550" y="74" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="middle">End-to-end flow from passwordless authentication to automated debt audit</text>

  <!-- Connector Line -->
  <line x1="160" y1="210" x2="940" y2="210" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6,6" />

  <!-- Step 1: Authentication -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="110" width="220" height="270" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="160" cy="155" r="30" fill="#eef2ff" />
    <text x="160" y="163" fill="#4f46e5" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">01</text>
    <text x="160" y="215" fill="#1e293b" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Authentication</text>
    <text x="160" y="245" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">📱 Phone + Mock OTP</text>
    <text x="160" y="270" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">🌐 Google 1-Click Sign-In</text>
    <text x="160" y="295" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">🔐 JWT Bearer Token</text>
    <rect x="75" y="330" width="170" height="28" rx="6" fill="#f1f5f9" />
    <text x="160" y="348" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bypass: 123456</text>
  </g>

  <!-- Step 2: Loan Creation -->
  <g filter="url(#cardShadow)">
    <rect x="310" y="110" width="220" height="270" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="420" cy="155" r="30" fill="#f0fdf4" />
    <text x="420" y="163" fill="#16a34a" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">02</text>
    <text x="420" y="215" fill="#1e293b" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Record Loan</text>
    <text x="420" y="245" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">💸 Lent vs 📥 Borrowed</text>
    <text x="420" y="270" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">📅 Target Due Date</text>
    <text x="420" y="295" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">📸 Receipt Photo Proof</text>
    <rect x="335" y="330" width="170" height="28" rx="6" fill="#f0fdf4" />
    <text x="420" y="348" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Multer 5MB Upload</text>
  </g>

  <!-- Step 3: Payment & Settlement -->
  <g filter="url(#cardShadow)">
    <rect x="570" y="110" width="220" height="270" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="680" cy="155" r="30" fill="#fef3c7" />
    <text x="680" y="163" fill="#d97706" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">03</text>
    <text x="680" y="215" fill="#1e293b" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Settlement</text>
    <text x="680" y="245" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">💳 Razorpay Online Gateway</text>
    <text x="680" y="270" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">🔻 Minus Repayment</text>
    <text x="680" y="295" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">🔺 Add Shared Debt</text>
    <rect x="595" y="330" width="170" height="28" rx="6" fill="#fef3c7" />
    <text x="680" y="348" fill="#b45309" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Partial &amp; Full Pay</text>
  </g>

  <!-- Step 4: Audit & Refunds -->
  <g filter="url(#cardShadow)">
    <rect x="830" y="110" width="220" height="270" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" />
    <circle cx="940" cy="155" r="30" fill="#fee2e2" />
    <text x="940" y="163" fill="#dc2626" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">04</text>
    <text x="940" y="215" fill="#1e293b" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Audit &amp; Refund</text>
    <text x="940" y="245" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">🚨 Overdue in RED</text>
    <text x="940" y="270" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">🔄 1-Click Admin Refund</text>
    <text x="940" y="295" fill="#64748b" font-family="sans-serif" font-size="12.5" text-anchor="middle">⚖️ Auto-Rebalance Debt</text>
    <rect x="855" y="330" width="170" height="28" rx="6" fill="#fee2e2" />
    <text x="940" y="348" fill="#991b1b" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Reconciliation</text>
  </g>
</svg>

