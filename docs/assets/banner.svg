<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bg)" />

  <!-- Grid decoration lines -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Title Pill -->
  <rect x="80" y="45" width="230" height="32" rx="16" fill="#ffffff" fill-opacity="0.2" />
  <text x="195" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">CREDSETU INTERNSHIP</text>

  <!-- Hero Main Heading -->
  <text x="80" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">MiniLedger Platform</text>
  <text x="80" y="165" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Full Stack Peer Lending, Friend Settlement &amp; Razorpay Gateway</text>

  <!-- Feature Pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <!-- Pill 1 -->
    <rect x="80" y="195" width="130" height="34" rx="17" fill="#10b981" />
    <text x="145" y="217" fill="#ffffff" text-anchor="middle">✓ Phone + OTP</text>

    <!-- Pill 2 -->
    <rect x="220" y="195" width="145" height="34" rx="17" fill="#3b82f6" />
    <text x="292" y="217" fill="#ffffff" text-anchor="middle">✓ Google Auth</text>

    <!-- Pill 3 -->
    <rect x="375" y="195" width="165" height="34" rx="17" fill="#f59e0b" />
    <text x="457" y="217" fill="#ffffff" text-anchor="middle">✓ Razorpay Gateway</text>

    <!-- Pill 4 -->
    <rect x="550" y="195" width="165" height="34" rx="17" fill="#ef4444" />
    <text x="632" y="217" fill="#ffffff" text-anchor="middle">✓ Overdue in RED</text>

    <!-- Pill 5 -->
    <rect x="725" y="195" width="145" height="34" rx="17" fill="#8b5cf6" />
    <text x="797" y="217" fill="#ffffff" text-anchor="middle">✓ Refund Admin</text>
  </g>

  <!-- Metric Glass Card 1 (Total Lent) -->
  <g filter="url(#shadow)">
    <rect x="80" y="260" width="230" height="110" rx="16" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="105" y="295" fill="#c7d2fe" font-family="sans-serif" font-size="13" font-weight="600">TOTAL LENT</text>
    <text x="105" y="338" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="800">₹75,000</text>
  </g>

  <!-- Metric Glass Card 2 (Total Repaid) -->
  <g filter="url(#shadow)">
    <rect x="330" y="260" width="230" height="110" rx="16" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="355" y="295" fill="#a7f3d0" font-family="sans-serif" font-size="13" font-weight="600">TOTAL REPAID</text>
    <text x="355" y="338" fill="#34d399" font-family="sans-serif" font-size="32" font-weight="800">₹52,500</text>
  </g>

  <!-- Metric Glass Card 3 (Overdue Highlighted in Red) -->
  <g filter="url(#shadow)">
    <rect x="580" y="260" width="230" height="110" rx="16" fill="url(#cardBg)" stroke="#f87171" stroke-opacity="0.6" stroke-width="2" />
    <text x="605" y="295" fill="#fecaca" font-family="sans-serif" font-size="13" font-weight="700">OVERDUE AMOUNT</text>
    <text x="605" y="338" fill="#ef4444" font-family="sans-serif" font-size="32" font-weight="800">₹12,500</text>
  </g>

  <!-- Metric Glass Card 4 (Net Balance) -->
  <g filter="url(#shadow)">
    <rect x="830" y="260" width="290" height="110" rx="16" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="855" y="295" fill="#fde68a" font-family="sans-serif" font-size="13" font-weight="600">NET BALANCE POSITION</text>
    <text x="855" y="338" fill="#fbbf24" font-family="sans-serif" font-size="32" font-weight="800">+₹22,500</text>
  </g>
</svg>
